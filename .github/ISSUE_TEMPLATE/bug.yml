name: Bug report
description: Report a reproducible MaintainerFlow defect using synthetic or redacted data.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or paste keys, PEM files, private payloads/source, or personal data here. Use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Local uv, CI, Other self-hosted]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the invariant that failed and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact commands and synthetic/redacted fixture; state whether it reproduces twice.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: OS/Python/Docker versions, failing test and error class. Remove secrets and private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no vulnerability details, secrets, private source/payloads, or personal data.
          required: true
