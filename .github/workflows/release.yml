name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MAINTAINERFLOW_GITHUB_APP_ID: "1"
  MAINTAINERFLOW_GITHUB_WEBHOOK_SECRET: replace-with-a-long-random-secret
  MAINTAINERFLOW_DATABASE_URL: postgresql+asyncpg://maintainerflow:maintainerflow@localhost:5432/maintainerflow
  MAINTAINERFLOW_REDIS_URL: redis://localhost:6379/0

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maintainerflow
          POSTGRES_USER: maintainerflow
          POSTGRES_PASSWORD: maintainerflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maintainerflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout tagged source and tag objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Validate annotated semantic tag and package version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          version="$(uv run python -c 'import maintainerflow; print(maintainerflow.__version__)')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Lint and format
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run mypy backend/src/maintainerflow
      - name: Unit and integration tests
        run: uv run pytest -m "not e2e"
      - name: Offline end-to-end tests
        run: uv run pytest -m e2e
      - name: Migration and schema drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Reproducible benchmark gate
        run: uv run maintainerflow benchmark --suite all --format json --output benchmark-report.json
      - name: Fresh-install smoke gate
        run: uv run python scripts/smoke_test.py --skip-docker

  compose-gate:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Start clean Compose stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait
      - name: Docker and migration smoke gate
        run: uv run python scripts/smoke_test.py
      - name: Docker-dependent end-to-end and upgrade tests
        run: uv run pytest -m e2e
        env:
          RUN_E2E: "1"
      - name: Capture diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  package:
    needs: [gate, compose-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Build release bundle
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p dist
          uv build --out-dir dist
          cp CHANGELOG.md dist/RELEASE_NOTES.md
          uv run maintainerflow benchmark --suite all --format json --output dist/benchmark-report.json
          uv run python - <<'PY' > dist/BUILD-METADATA.json
          import json
          import os
          import platform
          from maintainerflow import __version__

          metadata = {
              "schema_version": "maintainerflow-build-v1",
              "version": __version__,
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY
          (
            cd dist
            sha256sum *.whl *.tar.gz RELEASE_NOTES.md benchmark-report.json BUILD-METADATA.json > SHA256SUMS
          )
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download gated bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: dist
      - name: Verify checksums and build identity
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import json
          import os

          metadata = json.load(open("BUILD-METADATA.json", encoding="utf-8"))
          assert metadata["schema_version"] == "maintainerflow-build-v1"
          assert metadata["tag"] == os.environ["GITHUB_REF_NAME"]
          assert metadata["commit"] == os.environ["GITHUB_SHA"]
          assert metadata["tag"] == f"v{metadata['version']}"
          PY
      - name: Publish GitHub Release after every gate passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl
          dist/*.tar.gz
          dist/SHA256SUMS
          dist/BUILD-METADATA.json
          dist/benchmark-report.json
          dist/RELEASE_NOTES.md
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md
