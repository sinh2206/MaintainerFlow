name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAINTAINERFLOW_GITHUB_APP_ID: "1"
  MAINTAINERFLOW_GITHUB_WEBHOOK_SECRET: ci-only-secret-value
  MAINTAINERFLOW_DATABASE_URL: postgresql+asyncpg://maintainerflow:maintainerflow@localhost:5432/maintainerflow
  MAINTAINERFLOW_REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maintainerflow
          POSTGRES_USER: maintainerflow
          POSTGRES_PASSWORD: maintainerflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maintainerflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and format
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run mypy backend/src/maintainerflow
      - name: Unit and integration tests
        run: uv run pytest -m "not e2e"
      - name: Credential-free end-to-end tests
        run: uv run pytest -m e2e
      - name: Migrate and detect schema drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Reproduce all benchmark suites
        run: uv run maintainerflow benchmark --suite all --format json --output benchmark-report.json
      - name: Static smoke test
        run: uv run python scripts/smoke_test.py --skip-docker
