x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maintainerflow
      POSTGRES_USER: maintainerflow
      POSTGRES_PASSWORD: maintainerflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainerflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["dramatiq", "maintainerflow.worker.tasks", "--processes", "1", "--threads", "4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  recovery:
    <<: *app
    command: ["python", "-m", "maintainerflow.worker.recovery"]
    depends_on:
      worker:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
